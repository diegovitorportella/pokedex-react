spring.application.name=pokedex-api
# Hospedagens como o Render definem PORT; localmente continua 8080
server.port=${PORT:8080}

# Credenciais NUNCA vão para o GitHub: defina MONGODB_URI como variável de ambiente
# ou no arquivo backend/.env (ignorado pelo git). Veja backend/.env.example.
spring.config.import=optional:file:.env[.properties]
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pokedex}

# Origem permitida no CORS (frontend Vite)
pokedex.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Script SQL usado como fonte para popular o MongoDB na primeira execução
pokedex.seed.sql-path=${SEED_SQL_PATH:../Script_Pokedex.sql}
